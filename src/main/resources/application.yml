server:
  port: 8080

spring:
  application:
    name: ai-educatin

  # ---- 数据源 ----
  datasource:
    url: jdbc:mysql://localhost:3306/ai_education?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ---- Redis ----
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

# ---- MyBatis-Plus ----
mybatis-plus:
  configuration:
    # 驼峰映射
    map-underscore-to-camel-case: true
    # 开发阶段打印SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略: 数据库自增
      id-type: auto
      # 逻辑删除(暂不使用, 预留)
      # logic-delete-field: deleted
      # logic-delete-value: 1
      # logic-not-delete-value: 0
  type-aliases-package: org.example.ai_educatin.entity

# ---- Knife4j 接口文档 ----
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  packages-to-scan: org.example.ai_educatin.controller

knife4j:
  enable: true
  setting:
    language: zh_cn
